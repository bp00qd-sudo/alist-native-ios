name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check AList port tree
        run: |
          test -f Porting/iosbridge/bridge.go
          test -d AListCore
          test -f AListCore/go.mod

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project AListNativeUI.xcodeproj \
            -scheme AListNativeUI \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AListNativeUI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/AListNativeUI.xcarchive/Products/Applications/AListNative.app" Payload/
          zip -qry AListNativeUI-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AListNativeUI-unsigned-ipa
          path: AListNativeUI-unsigned.ipa
          retention-days: 14
